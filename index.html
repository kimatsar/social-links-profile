<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>

    <!-- CSS Reset -->
    <link
      rel="stylesheet"
      href="https://meyerweb.com/eric/tools/css/reset/reset.css"
    />

    <style>
      /* .design-overlay { */

      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter-VariableFont_slnt,wght.ttf")
          format("truetype-variations");
        font-weight: 300 900;
        font-style: normal;
      }

      :root {
        --green: hsl(75, 94%, 57%);
        --white: hsl(0, 0%, 100%);
        --grey-700: hsl(0, 0%, 20%);
        --grey-800: hsl(0, 0%, 12%);
        --grey-900: hsl(0, 0%, 8%);

        --regular-weight: 400;
        --semi-bold-weight: 600;
        --bold-weight: 700;
      }

      body {
        font-family: "Inter", sans-serif;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--grey-900);
        color: var(--white);
      }

      h1 {
        text-align: center;
        font-weight: var(--semi-bold-weight);
        font-size: 1.5rem;
      }

      figcaption {
        color: var(--green);
        text-align: center;
        font-weight: var(--semi-bold-weight);
        font-size: 0.9rem;
      }

      p {
        font-size: 14px;
        text-align: center;
        font-weight: var(--regular-weight);
      }

      img {
        width: 90px;
        aspect-ratio: 1/1;
        border-radius: 50%;
        display: block;
        margin: auto;
      }

      .card {
        background-color: var(--grey-800);
        width: 385px;
        /* height: 615px; */
        border-radius: 13px;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: clamp(24px, 1vw, 40px) clamp(24px, 1vw, 40px);
        gap: 28px;
        margin: 25px;
      }

      .bio {
        display: flex;
        flex-direction: column;
        gap: 30px;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .name-location {
        display: flex;
        flex-direction: column;
        gap: 13px;
      }

      button {
        color: var(--white);
        background-color: var(--grey-700);
        padding: 10px;
        font-weight: var(--bold-weight);
        border: none;
        padding: 13px;
        line-height: 1.5;
        letter-spacing: 0.5px;
        border-radius: 5px;
      }

      button:hover {
        background-color: var(--green);
        color: var(--grey-800);
      }

      /* .attribution { */
      /*   font-size: 0.6875rem; */
      /*   text-align: center; */
      /* } */
      /* .attribution a { */
      /*   color: hsl(228, 45%, 44%); */
      /* } */
    </style>
  </head>
  <body>
    <div class="design-overlay"></div>

    <div class="card">
      <div class="bio">
        <img src="assets/images/avatar-jessica.jpeg" alt="Profile picture" />

        <div class="name-location">
          <h1>Jessica Randall</h1>
          <figcaption>London, United Kingdom</figcaption>
        </div>

        <p>"Front-end developer and avid reader."</p>
      </div>

      <div class="links">
        <button>GitHub</button>
        <button>Frontend Mentor</button>
        <button>LinkedIn</button>
        <button>Twitter</button>
        <button>Instagram</button>
      </div>
    </div>

  </body>
</html>
